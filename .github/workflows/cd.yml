name: CD

on:
    push:
        branches:
            - main

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-go@v5
              with:
                  go-version: "stable"

            - run: go test ./...
            - run: go build -o kpip_server  ./cmd/server
            - run: go build -o kpip_manager ./cmd/manager

            - uses: actions/upload-artifact@v4
              with:
                  name: kpip_server
                  path: kpip_server

            - uses: actions/upload-artifact@v4
              with:
                  name: kpip_manager
                  path: kpip_manager
