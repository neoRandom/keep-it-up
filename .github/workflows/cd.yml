name: CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - run: go test ./...

      # 1. Build binaries
      - name: Build binaries
        run: |
          go build -o kpip_server ./cmd/server
          go build -o kpip_manager ./cmd/manager

      # 2. Stage files into a clean release folder
      - name: Prepare release bundle
        run: |
          mkdir -p dist
          cp kpip_server dist/
          cp kpip_manager dist/
          cp .env.example dist/
          cp -r database/migrations dist/migrations

      # 3. Upload the entire dist directory as a single zip artifact
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: kpip-release
          path: dist/
          include-hidden-files: true