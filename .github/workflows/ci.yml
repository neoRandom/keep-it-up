name: CI

on:
    pull_request:
        branches:
            - main

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-go@v5
              with:
                  go-version: "stable"

            - run: go test ./...
              env:
                  ISOLATED_TEST: "true"
            - run: go build -o kpip_server  ./cmd/server
            - run: go build -o kpip_manager ./cmd/manager
