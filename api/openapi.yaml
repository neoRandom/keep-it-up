openapi: 3.1.0

info:
  title: Keep It Up API
  version: 1.1.0

paths:
  /login:
    post:
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '204':
          description: Login successful; authentication cookies are set.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /games:
    get:
      summary: Get accessible games
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Games the authenticated player has access to.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Game'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /shared:
    get:
      summary: Get shared game data
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: Current shared state of the game.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/GameNotFound'

  /interactions:
    get:
      summary: Get recent interactions
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        '200':
          description: The latest interactions for the game.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Interaction'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/GameNotFound'

  /save:
    post:
      summary: Add a save interaction
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveRequest'
      responses:
        '204':
          description: Save interaction added.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/GameNotFound'
        '409':
          description: Game is not currently playing.

  /play:
    post:
      summary: Start or resume the game
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '204':
          description: Game resumed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/GameNotFound'
        '409':
          description: Game is already playing.

  /pause:
    post:
      summary: Pause the game
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '204':
          description: Game paused.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/GameNotFound'
        '409':
          description: Game is not currently playing.

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      schema:
        type: string

  parameters:
    GameId:
      name: gameId
      in: query
      required: true
      schema:
        type: integer
        format: int64

  responses:
    Unauthorized:
      description: Authentication required.

    GameNotFound:
      description: Game not found or inaccessible.

  schemas:
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    Game:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string

    SharedData:
      type: object
      required:
        - gameId
        - status
      properties:
        gameId:
          type: integer
          format: int64
        status:
          type: string
          enum:
            - not_started
            - playing
            - paused
        valid:
          type:
            - boolean
            - 'null'
        deadlineAt:
          type:
            - string
            - 'null'
          format: date-time
          description: The time at which the current active period expires.
        lastSavedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: The time at which the shared state was last saved.
        lastPausedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: The time at which the shared state was last paused.

    SaveRequest:
      type: object
      required:
        - duration
      properties:
        duration:
          type: integer
          format: int64
          minimum: 1
          description: Duration of the save, in seconds.

    Interaction:
      type: object
      required:
        - id
        - gameId
        - action
        - occurredAt
      properties:
        id:
          type: integer
          format: int64
        gameId:
          type: integer
          format: int64
        playerId:
          type: 
            - integer
            - 'null'
          format: int64
        action:
          type: string
          enum:
            - saved
            - paused
            - resumed
        occurredAt:
          type: string
          format: date-time
        savedBy:
          type:
            - integer
            - 'null'
          format: int64